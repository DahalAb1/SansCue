# Apply after compose.yaml, using deploy/production.sh. Requires Compose >= 2.24.4.
# One EC2 host and one sessions replica; capacity is not yet established.
name: sanscue-production

x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *runtime
    environment:
      SANSCUE_DOMAIN: "${SANSCUE_DOMAIN:?Set SANSCUE_DOMAIN}"
      ACME_EMAIL: "${ACME_EMAIL:?Set ACME_EMAIL}"
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:8081/healthz"]

  sessions:
    <<: *runtime
    environment:
      SESSIONS_PUBLIC_ORIGIN: "https://${SANSCUE_DOMAIN:?Set SANSCUE_DOMAIN}"
      SESSIONS_ALLOW_INSECURE_LOOPBACK: "false"
      SESSIONS_OPERATOR_TOKEN_SHA256: "${SESSIONS_OPERATOR_TOKEN_SHA256:?Provision operator access}"
      SESSIONS_OPERATOR_EPOCH: "${SESSIONS_OPERATOR_EPOCH:?Provision operator access}"
      SESSIONS_IDEMPOTENCY_HMAC_KEY: "${SESSIONS_IDEMPOTENCY_HMAC_KEY:?Provision operator access}"
      TOPICS_SESSIONS_SERVICE_TOKEN: "${TOPICS_SESSIONS_SERVICE_TOKEN:?Set transcript read token}"

  topics-and-questions:
    <<: *runtime
    environment:
      TOPICS_SESSIONS_SERVICE_TOKEN: "${TOPICS_SESSIONS_SERVICE_TOKEN:?Set transcript read token}"

  # The authenticated Mac worker reaches the loopback ports through SSH.
  # Do not run a second worker against this Bee database at the same time.
  bee-connection:
    <<: *runtime
    profiles: [container-worker]

  sessions-db:
    <<: *runtime
    ports: !reset []
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: "${SESSIONS_DB_BOOTSTRAP_PASSWORD:?Set independent bootstrap password}"
      SANSCUE_APP_USER: "${POSTGRES_USER:?Set POSTGRES_USER}"
      SANSCUE_APP_DB: "${POSTGRES_DB:?Set POSTGRES_DB}"
      SANSCUE_APP_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    volumes:
      - ./deploy/init-app-db.sh:/docker-entrypoint-initdb.d/10-app.sh:ro

  bee-db:
    <<: *runtime
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: "${BEE_DB_BOOTSTRAP_PASSWORD:?Set independent bootstrap password}"
      SANSCUE_APP_USER: "${BEE_POSTGRES_USER:?Set BEE_POSTGRES_USER}"
      SANSCUE_APP_DB: "${BEE_POSTGRES_DB:?Set BEE_POSTGRES_DB}"
      SANSCUE_APP_PASSWORD: "${BEE_POSTGRES_PASSWORD:?Set BEE_POSTGRES_PASSWORD}"
    volumes:
      - ./deploy/init-app-db.sh:/docker-entrypoint-initdb.d/10-app.sh:ro

  topics-db:
    <<: *runtime
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: "${TOPICS_DB_BOOTSTRAP_PASSWORD:?Set independent bootstrap password}"
      SANSCUE_APP_USER: "${TOPICS_POSTGRES_USER:?Set TOPICS_POSTGRES_USER}"
      SANSCUE_APP_DB: "${TOPICS_POSTGRES_DB:?Set TOPICS_POSTGRES_DB}"
      SANSCUE_APP_PASSWORD: "${TOPICS_POSTGRES_PASSWORD:?Set TOPICS_POSTGRES_PASSWORD}"
    volumes:
      - ./deploy/init-app-db.sh:/docker-entrypoint-initdb.d/10-app.sh:ro

volumes:
  sessions-db-data:
    name: sanscue-production-sessions-db-data
  bee-db-data:
    name: sanscue-production-bee-db-data
  topics-db-data:
    name: sanscue-production-topics-db-data
  caddy-data:
  caddy-config:
