# Local development only. Keep resolved configuration (including passwords) private.
name: sanscue

services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      sessions:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1/"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s

  sessions:
    build:
      context: .
      dockerfile: services/sessions/Dockerfile
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@sessions-db:5432/${POSTGRES_DB:?Set POSTGRES_DB in deploy/.env}"
      HTTP_HOST: "0.0.0.0"
      HTTP_PORT: "3000"
      SESSIONS_INTERNAL_HOST: "0.0.0.0"
      SESSIONS_INTERNAL_PORT: "3001"
      SESSIONS_PUBLIC_ORIGIN: "http://127.0.0.1:8080"
      # Staff transcript reads; optional, the panel reports itself unavailable without it.
      TOPICS_INTERNAL_URL: "http://topics-and-questions:3002"
      TOPICS_SESSIONS_SERVICE_TOKEN: "${TOPICS_SESSIONS_SERVICE_TOKEN:-}"
      SESSIONS_ALLOW_INSECURE_LOOPBACK: "true"
      # Operator access stays disabled (fail closed) unless all three are provisioned in deploy/.env.
      SESSIONS_OPERATOR_TOKEN_SHA256: "${SESSIONS_OPERATOR_TOKEN_SHA256:-}"
      SESSIONS_OPERATOR_EPOCH: "${SESSIONS_OPERATOR_EPOCH:-}"
      SESSIONS_IDEMPOTENCY_HMAC_KEY: "${SESSIONS_IDEMPOTENCY_HMAC_KEY:-}"
      SESSIONS_BEE_SERVICE_TOKEN: "${SESSIONS_BEE_SERVICE_TOKEN:?Set SESSIONS_BEE_SERVICE_TOKEN in deploy/.env}"
      SESSIONS_TOPICS_SERVICE_TOKEN: "${SESSIONS_TOPICS_SERVICE_TOKEN:?Set SESSIONS_TOPICS_SERVICE_TOKEN in deploy/.env}"
      # Moderator review queue: draft expiry and how many drafts are shown at once.
      SESSIONS_DRAFT_TTL_SECONDS: "${SESSIONS_DRAFT_TTL_SECONDS:-600}"
      SESSIONS_MAX_VISIBLE_DRAFTS: "${SESSIONS_MAX_VISIBLE_DRAFTS:-3}"
      RUST_LOG: "info"
    depends_on:
      sessions-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3401:3001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:3000/readyz"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

  topics-and-questions:
    build:
      context: .
      dockerfile: services/topics-and-questions/Dockerfile
    environment:
      TOPICS_DATABASE_URL: "postgresql://${TOPICS_POSTGRES_USER:?Set TOPICS_POSTGRES_USER in deploy/.env}:${TOPICS_POSTGRES_PASSWORD:?Set TOPICS_POSTGRES_PASSWORD in deploy/.env}@topics-db:5432/${TOPICS_POSTGRES_DB:?Set TOPICS_POSTGRES_DB in deploy/.env}"
      TOPICS_BEE_SERVICE_TOKEN: "${TOPICS_BEE_SERVICE_TOKEN:?Set TOPICS_BEE_SERVICE_TOKEN in deploy/.env}"
      SESSIONS_INTERNAL_URL: "http://sessions:3001"
      SESSIONS_TOPICS_SERVICE_TOKEN: "${SESSIONS_TOPICS_SERVICE_TOKEN:?Set SESSIONS_TOPICS_SERVICE_TOKEN in deploy/.env}"
      HTTP_HOST: "0.0.0.0"
      HTTP_PORT: "3002"
      TOPICS_SESSIONS_SERVICE_TOKEN: "${TOPICS_SESSIONS_SERVICE_TOKEN:-}"
      # Demo starting points, not settled values; override in deploy/.env after rehearsal.
      TOPICS_MIN_QUESTION_INTERVAL_SECONDS: "${TOPICS_MIN_QUESTION_INTERVAL_SECONDS:-90}"
      TOPICS_MIN_WINDOW_WORDS: "${TOPICS_MIN_WINDOW_WORDS:-60}"
      TOPICS_MAX_WINDOW_SECONDS: "180"
      TOPICS_SILENCE_BOUNDARY_SECONDS: "${TOPICS_SILENCE_BOUNDARY_SECONDS:-5}"
      TOPICS_MAX_TRANSCRIPT_AGE_SECONDS: "45"
      TOPICS_MIN_ATTEMPT_INTERVAL_SECONDS: "${TOPICS_MIN_ATTEMPT_INTERVAL_SECONDS:-15}"
      # Optional Claude question generation; all blank keeps the placeholder.
      # Configure one of: Anthropic API key, Bedrock API key, or Bedrock credentials file.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      AWS_BEARER_TOKEN_BEDROCK: "${AWS_BEARER_TOKEN_BEDROCK:-}"
      TOPICS_BEDROCK_CREDENTIALS_FILE: "${TOPICS_BEDROCK_CREDENTIALS_FILE:-}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      TOPICS_MODEL: "${TOPICS_MODEL:-}"
    volumes:
      # Written by deploy/refresh-bedrock-credentials.sh; read-only here.
      - ./local-data/bedrock:/run/bedrock:ro
    depends_on:
      topics-db:
        condition: service_healthy
      sessions:
        condition: service_healthy
    ports:
      - "127.0.0.1:3402:3002"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:3002/readyz"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

  topics-db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: "${TOPICS_POSTGRES_DB:?Set TOPICS_POSTGRES_DB in deploy/.env}"
      POSTGRES_USER: "${TOPICS_POSTGRES_USER:?Set TOPICS_POSTGRES_USER in deploy/.env}"
      POSTGRES_PASSWORD: "${TOPICS_POSTGRES_PASSWORD:?Set TOPICS_POSTGRES_PASSWORD in deploy/.env}"
    volumes:
      - topics-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  bee-connection:
    build:
      context: .
      dockerfile: services/bee-connection/Dockerfile
    environment:
      BEE_DATABASE_URL: "postgresql://${BEE_POSTGRES_USER:?Set BEE_POSTGRES_USER in deploy/.env}:${BEE_POSTGRES_PASSWORD:?Set BEE_POSTGRES_PASSWORD in deploy/.env}@bee-db:5432/${BEE_POSTGRES_DB:?Set BEE_POSTGRES_DB in deploy/.env}"
      SESSIONS_INTERNAL_URL: "http://sessions:3001"
      SESSIONS_BEE_SERVICE_TOKEN: "${SESSIONS_BEE_SERVICE_TOKEN:?Set SESSIONS_BEE_SERVICE_TOKEN in deploy/.env}"
      TOPICS_INTERNAL_URL: "http://topics-and-questions:3002"
      TOPICS_BEE_SERVICE_TOKEN: "${TOPICS_BEE_SERVICE_TOKEN:?Set TOPICS_BEE_SERVICE_TOKEN in deploy/.env}"
    depends_on:
      bee-db:
        condition: service_healthy
      sessions:
        condition: service_healthy
      topics-and-questions:
        condition: service_healthy

  bee-db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: "${BEE_POSTGRES_DB:?Set BEE_POSTGRES_DB in deploy/.env}"
      POSTGRES_USER: "${BEE_POSTGRES_USER:?Set BEE_POSTGRES_USER in deploy/.env}"
      POSTGRES_PASSWORD: "${BEE_POSTGRES_PASSWORD:?Set BEE_POSTGRES_PASSWORD in deploy/.env}"
    volumes:
      - bee-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  sessions-db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in deploy/.env}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sessions-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  sessions-db-data:
    name: sessions-db-data
  topics-db-data:
    name: topics-db-data
  bee-db-data:
    name: bee-db-data
