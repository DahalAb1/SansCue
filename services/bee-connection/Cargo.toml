[package]
name = "bee-connection"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "macros", "uuid", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
